name: Godot regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and check scripts
        shell: bash
        run: |
          set -o pipefail
          Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR:' import.log; then exit 1; fi
      - name: Run logic and scene regression suites
        shell: bash
        run: |
          set -o pipefail
          for suite in test_puzzle_logic test_puzzle_scene test_campaign_logic test_campaign_scene; do
            timeout 120 Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script "res://tests/$suite.gd" 2>&1 | tee "$suite.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR:' "$suite.log"; then exit 1; fi
          done
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-logs
          path: '*.log'
